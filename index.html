<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Verificar Jogos Loteria Federal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="index.css" rel="stylesheet">
</head>

<body>
  <main id="main" class="container ml-3 mr-3">
    <header class="bg-primary text-white text-center py-3">
      <h1>Verificar Apostas Loteria Federal</h1>
    </header>

    <div id="alerta" class="position-fixed start-50 translate-middle-x z-3"></div>

    <div class="row">
      <h3 id="tituloJogoSelecionado" class="text-center"></h3>

      <div id="sorteios" class="col-sm-4 border rounded-3"></div>

      <div id="apostas-realizadas" class="col-sm-4 border rounded-3">
        <div class="div-botoes">
          <button id="botao-adiciona-aposta" class="btn btn-primary">Adicionar Aposta</button>
        </div>
      </div>
       
      <div id="apostas-verificadas" class="col-sm-4 border  rounded-3"></div>
    </div>
    <button id="teste">teste</button>
  </main>

  <div id="modal-numeros-aposta-para-selecionar" class="modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Selecionar Números</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="numeros-para-selecionar" class="modal-body numeros-para-selecionar">
          
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary">Carregar</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="index.js"></script>
</body>

</html>
